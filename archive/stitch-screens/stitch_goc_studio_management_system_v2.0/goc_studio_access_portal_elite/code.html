<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GOC Studio - Auth Portal</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-bright": "#38393a",
                        "inverse-primary": "#c00100",
                        "surface-container-high": "#282a2b",
                        "secondary-fixed-dim": "#ffb4a8",
                        error: "#ffb4ab",
                        "on-primary-container": "#5c0000",
                        "primary-container": "#ff5540",
                        surface: "#121414",
                        "performance-red": "#FF2B2B",
                        "inverse-on-surface": "#2f3131",
                        "on-secondary-container": "#ff9f90",
                        "gold-glow": "rgba(255, 43, 43, 0.15)",
                        "on-error-container": "#ffdad6",
                        "surface-dim": "#121414",
                        "primary-fixed-dim": "#ffb4a8",
                        "on-background": "#e2e2e2",
                        "tertiary-container": "#929091",
                        secondary: "#ffb4a8",
                        "on-primary-fixed": "#410000",
                        primary: "#ffb4a8",
                        "surface-variant": "#333535",
                        "on-surface": "#e2e2e2",
                        "carbon-border": "rgba(255, 255, 255, 0.08)",
                        "surface-container-highest": "#333535",
                        tertiary: "#c8c6c7",
                        "tertiary-fixed-dim": "#c8c6c7",
                        "on-secondary-fixed": "#410000",
                        "inverse-surface": "#e2e2e2",
                        "on-primary": "#690100",
                        background: "#050505",
                        "outline-variant": "#594137",
                        "on-secondary-fixed-variant": "#930000",
                        "on-tertiary-fixed": "#1c1b1d",
                        "prestige-gold": "#D4AF37",
                        "on-surface-variant": "#e2bfb1",
                        "primary-fixed": "#ffdad4",
                        "surface-tint": "#ffb4a8",
                        "void-black": "#050505",
                        "surface-container-lowest": "#0c0f0f",
                        "on-error": "#690005",
                        "on-secondary": "#690000",
                        "on-tertiary": "#313031",
                        "on-tertiary-container": "#2a292b",
                        "secondary-container": "#980000",
                        "secondary-fixed": "#ffdad4",
                        "tertiary-fixed": "#e5e2e3",
                        "surface-container-low": "#1a1c1c",
                        "on-primary-fixed-variant": "#930100",
                        outline: "#a98a7e",
                        "on-tertiary-fixed-variant": "#474648",
                        "surface-container": "#1e2020",
                        "obsidian-glass": "rgba(16, 17, 20, 0.55)",
                        "error-container": "#93000a"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "panel-gap": "1rem",
                        "grid-margin": "2rem",
                        "gutter-md": "1.5rem",
                        "bento-unit": "160px"
                    },
                    fontFamily: {
                        "headline-lg": ["Outfit", "sans-serif"],
                        "data-lg": ["JetBrains Mono", "monospace"],
                        "body-lg": ["Outfit", "sans-serif"],
                        "display-hero": ["Outfit", "sans-serif"],
                        "headline-md": ["Outfit", "sans-serif"],
                        "label-caps": ["JetBrains Mono", "monospace"],
                        "data-sm": ["JetBrains Mono", "monospace"]
                    },
                    fontSize: {
                        "headline-lg": ["40px", {lineHeight: "1.2", fontWeight: "600"}],
                        "data-lg": ["18px", {lineHeight: "1.4", letterSpacing: "0.02em", fontWeight: "500"}],
                        "body-lg": ["16px", {lineHeight: "1.6", fontWeight: "400"}],
                        "display-hero": ["64px", {lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700"}],
                        "headline-md": ["24px", {lineHeight: "1.3", fontWeight: "600"}],
                        "label-caps": ["11px", {lineHeight: "1.2", letterSpacing: "0.1em", fontWeight: "700"}],
                        "data-sm": ["13px", {lineHeight: "1.4", fontWeight: "400"}]
                    },
                    keyframes: {
                        shimmer: {
                            '100%': { transform: 'translateX(100%)' }
                        }
                    }
                }
            }
        };
    </script>
<style>
        /* Ambient Background Effect */
        .ambient-glow {
            position: absolute;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(255,43,43,0.06) 0%, rgba(5,5,5,0) 75%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Input Autofill Override for Dark Mode */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #1a1c1c inset !important;
            -webkit-text-fill-color: #e2e2e2 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Telemetry Accent Lines */
        .telemetry-line-h {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,43,43,0.15), transparent);
            width: 100%;
            z-index: 1;
        }
        .telemetry-line-v {
            position: absolute;
            width: 1px;
            background: linear-gradient(180deg, transparent, rgba(255,43,43,0.15), transparent);
            height: 100%;
            z-index: 1;
        }
        
        .performance-gradient {
            background: linear-gradient(135deg, #FF2B2B 0%, #A30000 100%);
        }
        
        .glass-panel {
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            background: rgba(16, 17, 20, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-[#050505] min-h-screen flex items-center justify-center relative overflow-hidden font-body-lg text-body-lg text-on-surface selection:bg-performance-red selection:text-white">
<!-- Subtle Ambient Glow -->
<div class="ambient-glow"></div>
<!-- Telemetry Accents -->
<div class="telemetry-line-h top-[25%] opacity-40"></div>
<div class="telemetry-line-h bottom-[25%] opacity-40"></div>
<div class="telemetry-line-v left-[20%] opacity-40"></div>
<div class="telemetry-line-v right-[20%] opacity-40"></div>
<!-- Login Panel -->
<main class="w-full max-w-[480px] px-6 relative z-10">
<!-- Glass Container -->
<div class="glass-panel rounded-xl shadow-[0_0_80px_rgba(0,0,0,0.5),0_0_40px_rgba(255,43,43,0.05)] relative overflow-hidden transition-all duration-700">
<!-- Inner Red Accent Ring (Subtle) -->
<div class="absolute inset-0 pointer-events-none rounded-xl border border-performance-red/10"></div>
<!-- Metallic Top Edge Reflection -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
<div class="p-10 sm:p-14">
<!-- Brand Header -->
<header class="text-center mb-12 flex flex-col items-center">
<div class="relative group mb-6">
<span class="material-symbols-outlined text-performance-red text-[42px] drop-shadow-[0_0_12px_rgba(255,43,43,0.4)]" style="font-variation-settings: 'FILL' 1;">diamond</span>
<div class="absolute inset-0 bg-performance-red/20 blur-xl scale-150 rounded-full opacity-50"></div>
</div>
<h1 class="font-display-hero text-display-hero text-white uppercase tracking-[-0.04em] drop-shadow-[0_0_20px_rgba(255,43,43,0.15)]">
                    GOC
                </h1>
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.3em] mt-3 opacity-80">
                    Studio Management
                </h2>
</header>
<!-- Form -->
<form class="space-y-6" id="auth-form" onsubmit="event.preventDefault(); simulateError();">
<!-- Error Message Area (Hidden by default) -->
<div class="hidden bg-performance-red/10 border border-performance-red/30 rounded-lg p-3 flex items-center gap-3 transition-all duration-300" id="error-container">
<span class="material-symbols-outlined text-performance-red text-sm" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-data-sm text-data-sm text-performance-red">Authentication failed. Invalid security sequence.</p>
</div>
<!-- Operator ID Input -->
<div class="space-y-2.5">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2 group cursor-pointer" for="phone">
<span class="w-1 h-1 rounded-full bg-performance-red shadow-[0_0_5px_#FF2B2B]"></span>
<span class="group-hover:text-performance-red transition-colors duration-300">Operator ID</span>
</label>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 group-focus-within:text-performance-red transition-all duration-300">
                            terminal
                        </span>
<input autocomplete="off" class="w-full bg-surface-container-low/30 border border-white/5 rounded-lg py-4 pl-12 pr-4 font-data-lg text-data-lg text-on-surface placeholder:text-on-surface-variant/30 focus:outline-none focus:border-performance-red/60 focus:bg-surface-container-low/50 focus:ring-0 transition-all duration-500 shadow-inner" id="phone" name="phone" placeholder="Enter Access Code" type="text"/>
</div>
</div>
<!-- Security Key Input -->
<div class="space-y-2.5">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2 group cursor-pointer" for="password">
<span class="w-1 h-1 rounded-full bg-performance-red shadow-[0_0_5px_#FF2B2B]"></span>
<span class="group-hover:text-performance-red transition-colors duration-300">Security Key</span>
</label>
<a class="font-data-sm text-data-sm text-performance-red/80 hover:text-performance-red hover:underline decoration-1 underline-offset-4 transition-all duration-300" href="#">Recover?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 group-focus-within:text-performance-red transition-all duration-300">
                            lock
                        </span>
<input class="w-full bg-surface-container-low/30 border border-white/5 rounded-lg py-4 pl-12 pr-12 font-data-lg text-data-lg text-on-surface placeholder:text-on-surface-variant/30 focus:outline-none focus:border-performance-red/60 focus:bg-surface-container-low/50 focus:ring-0 transition-all duration-500 shadow-inner tracking-widest" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 hover:text-performance-red transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit CTA -->
<div class="pt-4">
<button class="w-full relative overflow-hidden group performance-gradient text-white font-headline-md text-headline-md rounded-lg py-5 flex justify-center items-center gap-3 transition-all duration-500 hover:shadow-[0_0_40px_rgba(255,43,43,0.35)] active:scale-[0.98]" type="submit">
<!-- Shimmer Effect -->
<div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent group-hover:animate-[shimmer_2s_infinite] skew-x-12"></div>
<span class="relative z-10 tracking-tight font-bold">ENTER DETAILING HANGAR</span>
<span class="material-symbols-outlined relative z-10 transition-transform duration-500 group-hover:translate-x-2" style="font-variation-settings: 'wght' 600;">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Telemetry Data -->
<div class="mt-10 pt-6 border-t border-white/5 flex justify-between items-center opacity-40 group-hover:opacity-100 transition-opacity duration-500">
<div class="flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-performance-red animate-[pulse_2s_infinite] shadow-[0_0_8px_#FF2B2B]"></span>
<span class="font-data-sm text-data-sm text-on-surface-variant uppercase">Secure_Link: Active</span>
</div>
<span class="font-data-sm text-data-sm text-on-surface-variant">REL_2.4.01</span>
</div>
</div>
</div>
<!-- External HUD Elements -->
<div class="absolute -top-16 -left-16 font-data-sm text-data-sm text-performance-red/20 rotate-[-90deg] tracking-[0.3em] font-medium pointer-events-none">
        NODE_01_SECURED
    </div>
<div class="absolute -bottom-16 -right-16 font-data-sm text-data-sm text-performance-red/20 rotate-[-90deg] tracking-[0.3em] font-medium pointer-events-none">
        AWAITING_PROTOCOLS
    </div>
</main>
<script>
    // Micro-interaction for password visibility
    function togglePassword() {
        const pwdInput = document.getElementById('password');
        const icon = document.getElementById('visibility-icon');
        
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            icon.textContent = 'visibility_off';
            icon.classList.add('text-performance-red');
            icon.classList.remove('text-on-surface-variant/40');
        } else {
            pwdInput.type = 'password';
            icon.textContent = 'visibility';
            icon.classList.remove('text-performance-red');
            icon.classList.add('text-on-surface-variant/40');
        }
    }

    // Simulate Error state logic
    function simulateError() {
        const errorContainer = document.getElementById('error-container');
        const inputs = document.querySelectorAll('input');
        
        // Show error container
        errorContainer.classList.remove('hidden');
        errorContainer.classList.add('animate-[pulse_0.4s_ease-in-out_2]');
        
        // Apply error styles to inputs
        inputs.forEach(input => {
            const originalBorder = 'border-white/5';
            input.classList.remove(originalBorder, 'focus:border-performance-red/60');
            input.classList.add('border-performance-red', 'bg-performance-red/5');
            
            // Reset after 4 seconds
            setTimeout(() => {
                input.classList.add(originalBorder, 'focus:border-performance-red/60');
                input.classList.remove('border-performance-red', 'bg-performance-red/5');
                errorContainer.classList.add('hidden');
            }, 4000);
        });
    }
</script>
</body></html>
